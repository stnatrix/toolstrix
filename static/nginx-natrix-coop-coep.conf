# ============================================================
# Добавить эти строки ВНУТРЬ существующего server{} блока
# (в тот же location, где отдаётся static/index.html),
# в файле конфига твоего сайта, например ytdlp-web.conf
#
# Эти заголовки обязательны для SharedArrayBuffer, который
# использует ffmpeg.wasm в разделе natrix mpeg.
# ============================================================

add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Embedder-Policy "require-corp" always;

# Если после этого перестанут грузиться внешние ресурсы (шрифты,
# сама ffmpeg.wasm с unpkg.com) — это ожидаемо для require-corp.
# Дважды проверь, что в браузере (DevTools -> Network) все внешние
# скрипты либо грузятся с CORS-заголовками (unpkg отдаёт их по
# умолчанию), либо перенеси их к себе на сервер (см. заметку ниже).
