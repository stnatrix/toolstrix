# ============================================================
# УСТАРЕЛО — НИЧЕГО ИЗ ЭТОГО ФАЙЛА В NGINX ДОБАВЛЯТЬ НЕ НАДО.
#
# Раньше заголовки cross-origin isolation, без которых не работает
# ffmpeg.wasm (natrix.mpeg и natrix.compress), предлагалось прописывать
# в nginx. Теперь их выставляет само приложение — middleware
# cross_origin_isolation в main.py:
#
#   Cross-Origin-Opener-Policy:   same-origin
#   Cross-Origin-Embedder-Policy: require-corp
#   Cross-Origin-Resource-Policy: same-origin
#   Cache-Control: no-cache        (только для /static/)
#
# Почему в приложении, а не в nginx:
#   * проект остаётся рабочим при любом способе запуска — напрямую через
#     uvicorn, за другим прокси, локально на 127.0.0.1;
#   * нельзя случайно получить дубли заголовков.
#
# ЕСЛИ добавить эти же add_header в nginx — заголовки продублируются,
# и браузер может отвергнуть COEP целиком. Не добавляй.
#
# Требование require-corp выполнимо только потому, что у страницы нет
# внешних ресурсов: шрифты лежат в /static/fonts, ffmpeg — в /static/ffmpeg.
# Если когда-нибудь вернёшь <link> на fonts.googleapis.com — шрифты
# заблокируются, а ffmpeg перестанет грузиться.
# ============================================================
