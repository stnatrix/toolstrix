# Конфиг для tools.stnatrix.space
# Кладётся в /etc/nginx/sites-available/ytdlp-web.conf
# и линкуется в sites-enabled — не трогает существующие конфиги 3x-ui / Hysteria2

server {
    listen 80;
    listen [::]:80;
    server_name tools.stnatrix.space;

    # Cloudflare сам терминирует SSL снаружи (оранжевое облачко),
    # поэтому здесь достаточно слушать 80 и настроить SSL-режим
    # в Cloudflare как "Flexible" ИЛИ поставить сертификат Origin CA (см. инструкцию ниже)

    client_max_body_size 0;   # видео могут быть большими, не режем
    proxy_read_timeout 600s;  # долгие скачивания не должны обрываться по таймауту
    proxy_send_timeout 600s;

    location / {
        proxy_pass http://127.0.0.1:8099;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
}
