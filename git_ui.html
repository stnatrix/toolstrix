<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Git Web UI Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0d0f12;
            --bg-secondary: rgba(22, 26, 33, 0.7);
            --bg-glass: rgba(30, 36, 45, 0.4);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-primary: #f0f3f6;
            --text-secondary: #8b949e;
            --accent: #58a6ff;
            --accent-glow: rgba(88, 166, 255, 0.15);
            --green: #3fb950;
            --green-bg: rgba(63, 185, 80, 0.15);
            --red: #f85149;
            --red-bg: rgba(248, 81, 73, 0.15);
            --card-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background-image: 
                radial-gradient(at 0% 0%, rgba(88, 166, 255, 0.05) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(63, 185, 80, 0.03) 0px, transparent 50%);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background: var(--bg-secondary);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            z-index: 10;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-section h1 {
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: -0.5px;
            background: linear-gradient(45deg, var(--accent), #a371f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .branch-badge {
            background: var(--accent-glow);
            color: var(--accent);
            border: 1px solid rgba(88, 166, 255, 0.3);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .branch-badge::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent);
        }

        .header-actions {
            display: flex;
            gap: 12px;
        }

        button {
            font-family: inherit;
            background: var(--bg-glass);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.9rem;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        button:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-1px);
        }

        button.primary {
            background: var(--accent);
            color: #000;
            border: none;
            font-weight: 600;
        }

        button.primary:hover {
            background: #79c0ff;
            box-shadow: 0 0 15px rgba(88, 166, 255, 0.4);
        }

        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .sidebar {
            width: 350px;
            border-right: 1px solid var(--border-color);
            background: rgba(15, 18, 23, 0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .section-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-secondary);
            padding: 16px 20px 8px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .file-list-container {
            flex: 1;
            overflow-y: auto;
            padding: 0 10px;
        }

        .file-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid transparent;
        }

        .file-item:hover {
            background: var(--bg-glass);
            border-color: var(--border-color);
        }

        .file-item.active {
            background: rgba(88, 166, 255, 0.08);
            border-color: rgba(88, 166, 255, 0.2);
        }

        .file-info {
            display: flex;
            align-items: center;
            gap: 10px;
            overflow: hidden;
            flex: 1;
        }

        .file-name {
            font-size: 0.9rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .status-tag {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 4px;
            text-transform: uppercase;
        }

        .status-tag.modified { color: #d29922; background: rgba(210, 153, 34, 0.1); }
        .status-tag.untracked { color: var(--accent); background: var(--accent-glow); }
        .status-tag.deleted { color: var(--red); background: var(--red-bg); }
        .status-tag.staged { color: var(--green); background: var(--green-bg); }

        .checkbox-container {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 20px;
        }

        .checkbox-container input {
            cursor: pointer;
            accent-color: var(--accent);
        }

        .commit-panel {
            padding: 20px;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .commit-input {
            width: 100%;
            min-height: 80px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.9rem;
            resize: none;
            outline: none;
            transition: border-color 0.2s;
        }

        .commit-input:focus {
            border-color: var(--accent);
        }

        .content-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: rgba(10, 12, 16, 0.3);
        }

        .diff-header {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-secondary);
        }

        .diff-file-title {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.95rem;
            color: var(--text-primary);
        }

        .diff-viewer {
            flex: 1;
            overflow: auto;
            padding: 20px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            line-height: 1.6;
            background: #090b0d;
        }

        .diff-line {
            display: flex;
            white-space: pre-wrap;
            padding: 1px 8px;
            border-radius: 2px;
        }

        .diff-line.addition {
            background-color: var(--green-bg);
            color: #7ee787;
        }

        .diff-line.deletion {
            background-color: var(--red-bg);
            color: #ff7b72;
        }

        .diff-line.chunk-header {
            background-color: rgba(163, 113, 247, 0.15);
            color: #d2a8ff;
        }

        .diff-line.normal {
            color: var(--text-secondary);
        }

        .empty-diff {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-secondary);
            gap: 16px;
        }

        .empty-diff svg {
            width: 64px;
            height: 64px;
            stroke: var(--text-secondary);
            opacity: 0.3;
        }

        .history-panel {
            border-top: 1px solid var(--border-color);
            background: var(--bg-secondary);
            max-height: 250px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .history-header {
            padding: 12px 24px;
            border-bottom: 1px solid var(--border-color);
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-secondary);
            background: rgba(22, 26, 33, 0.9);
            position: sticky;
            top: 0;
            z-index: 2;
        }

        .history-list {
            display: flex;
            flex-direction: column;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            font-size: 0.9rem;
            transition: background 0.2s;
        }

        .history-item:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        .history-item-left {
            display: flex;
            align-items: center;
            gap: 12px;
            overflow: hidden;
        }

        .commit-hash {
            font-family: 'JetBrains Mono', monospace;
            color: var(--accent);
            font-weight: 500;
            font-size: 0.85rem;
            background: var(--accent-glow);
            padding: 2px 6px;
            border-radius: 4px;
        }

        .commit-msg {
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .history-item-right {
            display: flex;
            align-items: center;
            gap: 16px;
            color: var(--text-secondary);
            font-size: 0.8rem;
        }

        .commit-author {
            max-width: 100px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-section">
            <h1>Git Workspace Controller</h1>
            <div id="branch-name" class="branch-badge">loading...</div>
        </div>
        <div class="header-actions">
            <button onclick="stageAll()">Stage All</button>
            <button onclick="unstageAll()">Unstage All</button>
            <button onclick="refreshData()" class="primary">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
                Refresh
            </button>
        </div>
    </header>

    <div class="main-container">
        <div class="sidebar">
            <div class="section-title">
                <span>Working Directory Changes</span>
                <span id="changes-count">0</span>
            </div>

            <div class="file-list-container" id="file-list">
            </div>

            <div class="commit-panel">
                <textarea id="commit-msg-input" class="commit-input" placeholder="Type commit message... (Ctrl+Enter to commit)"></textarea>
                <button onclick="commitChanges()" class="primary" style="width: 100%; justify-content: center;">
                    Commit Changes
                </button>
            </div>
        </div>

        <div class="content-area">
            <div class="diff-header">
                <div class="diff-file-title" id="active-file-title">No file selected</div>
                <div class="diff-actions" id="diff-actions-container" style="display: none;">
                    <button id="discard-btn" style="border-color: var(--red); color: var(--red);">Discard Changes</button>
                </div>
            </div>

            <div class="diff-viewer" id="diff-content">
                <div class="empty-diff">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6" stroke-linecap="round"/>
                    </svg>
                    <p>Select a file from the sidebar to inspect diffs</p>
                </div>
            </div>
        </div>
    </div>

    <div class="history-panel">
        <div class="history-header">Recent Commits</div>
        <div class="history-list" id="history-list">
        </div>
    </div>

    <script>
        let currentStatus = { branch: '', files: [] };
        let selectedFile = null;

        async function fetchAPI(endpoint, options = {}) {
            try {
                const response = await fetch(endpoint, {
                    headers: { 'Content-Type': 'application/json' },
                    ...options
                });
                if (!response.ok) {
                    const err = await response.json();
                    throw new Error(err.detail || 'API error');
                }
                return await response.json();
            } catch (err) {
                alert(`Error: ${err.message}`);
                console.error(err);
            }
        }

        async function refreshData() {
            const status = await fetchAPI('/api/status');
            if (status) {
                currentStatus = status;
                document.getElementById('branch-name').innerText = status.branch;
                renderFileList();
            }
            const logData = await fetchAPI('/api/log');
            if (logData) {
                renderHistory(logData.commits);
            }
        }

        function renderFileList() {
            const container = document.getElementById('file-list');
            container.innerHTML = '';
            
            document.getElementById('changes-count').innerText = currentStatus.files.length;

            if (currentStatus.files.length === 0) {
                container.innerHTML = '<div style="padding: 20px; text-align: center; color: var(--text-secondary);">No changes detected. Working tree clean.</div>';
                return;
            }

            currentStatus.files.forEach(file => {
                const item = document.createElement('div');
                item.className = `file-item ${selectedFile && selectedFile.path === file.path ? 'active' : ''}`;
                
                let statusLabel = file.status_code;
                let statusClass = 'untracked';
                if (file.staged) {
                    statusClass = 'staged';
                    statusLabel = 'staged';
                } else if (file.status_code === ' M' || file.status_code === 'M ') {
                    statusClass = 'modified';
                    statusLabel = 'modified';
                } else if (file.status_code === ' D' || file.status_code === 'D ') {
                    statusClass = 'deleted';
                    statusLabel = 'deleted';
                } else if (file.status_code === '??') {
                    statusClass = 'untracked';
                    statusLabel = 'untracked';
                }

                item.innerHTML = `
                    <div class="file-info" onclick="selectFile('${file.path}', ${file.staged})">
                        <span class="status-tag ${statusClass}">${statusLabel}</span>
                        <span class="file-name" title="${file.path}">${file.path}</span>
                    </div>
                    <div class="checkbox-container">
                        <input type="checkbox" ${file.staged ? 'checked' : ''} onclick="toggleStage(event, '${file.path}', this.checked)">
                    </div>
                `;
                container.appendChild(item);
            });
        }

        async function selectFile(path, staged) {
            selectedFile = { path, staged };
            
            document.querySelectorAll('.file-item').forEach(el => el.classList.remove('active'));
            const fileItems = Array.from(document.querySelectorAll('.file-name'));
            const match = fileItems.find(el => el.innerText === path);
            if (match) {
                match.closest('.file-item').classList.add('active');
            }

            document.getElementById('active-file-title').innerText = path;
            
            const fileObj = currentStatus.files.find(f => f.path === path);
            const discardBtnContainer = document.getElementById('diff-actions-container');
            const discardBtn = document.getElementById('discard-btn');
            
            if (fileObj && !fileObj.staged && fileObj.status_code !== '??') {
                discardBtnContainer.style.display = 'block';
                discardBtn.onclick = () => discardFile(path);
            } else {
                discardBtnContainer.style.display = 'none';
            }

            const diffData = await fetchAPI(`/api/diff?path=${encodeURIComponent(path)}&staged=${staged}`);
            if (diffData) {
                renderDiff(diffData.diff);
            }
        }

        function renderDiff(diffText) {
            const container = document.getElementById('diff-content');
            container.innerHTML = '';
            
            if (!diffText.trim()) {
                container.innerHTML = '<div class="empty-diff"><p>No changes to display or binary file.</p></div>';
                return;
            }

            const lines = diffText.split('\n');
            lines.forEach(line => {
                const lineEl = document.createElement('div');
                if (line.startsWith('+') && !line.startsWith('+++')) {
                    lineEl.className = 'diff-line addition';
                } else if (line.startsWith('-') && !line.startsWith('---')) {
                    lineEl.className = 'diff-line deletion';
                } else if (line.startsWith('@@')) {
                    lineEl.className = 'diff-line chunk-header';
                } else {
                    lineEl.className = 'diff-line normal';
                }
                lineEl.textContent = line;
                container.appendChild(lineEl);
            });
        }

        async function toggleStage(event, path, stage) {
            event.stopPropagation();
            await fetchAPI('/api/stage', {
                method: 'POST',
                body: JSON.stringify({ path, stage })
            });
            await refreshData();
            if (selectedFile && selectedFile.path === path) {
                selectFile(path, stage);
            }
        }

        async function stageAll() {
            await fetchAPI('/api/stage-all', { method: 'POST' });
            await refreshData();
            if (selectedFile) selectFile(selectedFile.path, true);
        }

        async function unstageAll() {
            await fetchAPI('/api/unstage-all', { method: 'POST' });
            await refreshData();
            if (selectedFile) selectFile(selectedFile.path, false);
        }

        async function discardFile(path) {
            if (confirm(`Are you sure you want to discard all changes in ${path}? This action cannot be undone.`)) {
                await fetchAPI('/api/discard', {
                    method: 'POST',
                    body: JSON.stringify({ path })
                });
                selectedFile = null;
                document.getElementById('active-file-title').innerText = 'No file selected';
                document.getElementById('diff-content').innerHTML = `
                    <div class="empty-diff">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6" stroke-linecap="round"/>
                        </svg>
                        <p>Select a file from the sidebar to inspect diffs</p>
                    </div>
                `;
                document.getElementById('diff-actions-container').style.display = 'none';
                await refreshData();
            }
        }

        async function commitChanges() {
            const msgInput = document.getElementById('commit-msg-input');
            const message = msgInput.value;
            if (!message.trim()) {
                alert('Please type a commit message first.');
                return;
            }
            const res = await fetchAPI('/api/commit', {
                method: 'POST',
                body: JSON.stringify({ message })
            });
            if (res) {
                msgInput.value = '';
                selectedFile = null;
                await refreshData();
            }
        }

        function renderHistory(commits) {
            const container = document.getElementById('history-list');
            container.innerHTML = '';
            if (commits.length === 0) {
                container.innerHTML = '<div style="padding: 20px; text-align: center; color: var(--text-secondary);">No commits found.</div>';
                return;
            }
            commits.forEach(commit => {
                const item = document.createElement('div');
                item.className = 'history-item';
                item.innerHTML = `
                    <div class="history-item-left">
                        <span class="commit-hash">${commit.hash}</span>
                        <span class="commit-msg" title="${commit.message}">${commit.message}</span>
                    </div>
                    <div class="history-item-right">
                        <span class="commit-author" title="${commit.author}">${commit.author}</span>
                        <span>${commit.date}</span>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        document.getElementById('commit-msg-input').addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'Enter') {
                commitChanges();
            }
        });

        refreshData();
    </script>
</body>
</html>
